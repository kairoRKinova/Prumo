<head>

<body>

<div id="login" hidden>
  <h3 style="margin-top:0">Entrar</h3>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="p" id="entrar" style="width:100%;margin-top:8px">Entrar</button>
</div>

<div id="app" hidden>

      <b>Prumo</b><small>Gestão Financeira</small>
    </div>
    <nav id="tabs">
      <button data-t="painel" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Painel</span></button>
      <button data-t="realizado"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Conta corrente</span></button>
      <button data-t="previsto"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Previsto</span></button>
      <button data-t="categorias"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Plano de contas</span></button>
      <button data-t="relatorios"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/></svg><span>Relatórios</span></button>
      <button data-t="resultados"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg><span>Resultados</span></button>
      <button data-t="usuarios" hidden><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 11a3 3 0 1 0 0-6M18 14.2c2.2.5 3.5 2.2 3.5 4.8"/></svg><span>Usuários</span></button>
    </nav>
    <div class="rodape">
      <svg class="ic" viewBox="0 0 1324 1188"> <path d="M 461,1005 460,1051 467,1077 478,1098 493,1116 511,1130 537,1141 554,1144 752,1145 783,1140 813,1125 837,1103 855,1074 863,1044 862,1009 851,970 832,935 816,924 802,926 783,944 717,956 664,960 610,957 538,944 521,927 506,924 492,933 480,951 468,979 Z M 810,957 812,959 813,963 813,972 812,973 812,978 806,993 796,1006 767,1032 759,1045 758,1056 760,1063 765,1072 772,1080 771,1082 768,1082 755,1075 743,1062 739,1053 739,1047 738,1046 740,1034 742,1029 749,1019 762,1006 784,990 798,977 803,970 808,958 Z M 512,957 514,958 518,968 526,979 537,989 558,1004 575,1021 582,1033 584,1040 584,1050 580,1061 571,1072 557,1081 552,1082 551,1079 558,1071 562,1064 564,1058 563,1044 557,1034 548,1025 541,1020 522,1001 517,994 513,986 509,971 510,959 Z M 9,213 0,250 17,304 112,409 227,432 356,384 380,396 343,411 315,449 362,423 374,477 412,476 428,439 447,466 410,501 364,492 392,665 450,861 445,948 533,859 584,680 579,599 522,403 449,266 503,163 434,189 504,107 535,91 513,128 572,107 554,135 617,105 619,171 672,106 671,145 720,120 776,118 824,138 873,187 805,163 859,273 796,395 732,663 787,863 876,948 872,861 958,493 911,501 877,462 893,439 907,474 941,480 962,459 960,423 1007,449 984,415 942,396 965,384 1089,431 1195,417 1275,351 1323,247 1296,197 1192,164 1109,176 1014,240 982,240 848,108 880,118 818,54 745,27 674,32 592,0 535,10 475,50 419,116 458,103 336,240 161,166 68,178 Z" fill="#2FD46F" fill-rule="evenodd" clip-rule="evenodd"/>
</svg>
      <b>Prumo</b><small>Gestão Financeira</small>
    </div>
  </aside>

  <div class="conteudo">
    <header>
      <div class="titulo">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 21v-6M12 21V9M19 21V3"/></svg>
        <div><h1>Fazenda Carioca</h1><p>Acompanhe o desempenho financeiro do período</p></div>
      </div>
      <div class="filtro">
        <select id="pre" aria-label="Período">
          <option value="mes">Mês atual</option>
          <option value="ant">Mês anterior</option>
          <option value="30">Últimos 30 dias</option>
          <option value="ano">Ano rural atual</option>
          <option value="custom">Personalizado</option>
        </select>
        <label><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><input type="date" id="de" aria-label="De"></label>
        <label><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><input type="date" id="ate" aria-label="Até"></label>
        <button class="verde" id="bk"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>Exportar backup</button>
        <button id="sair"><svg class="ic" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sair</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
 
  <dialog id="det">
    <div class="dh"><h3 id="det-t"></h3><button id="det-x">Fechar</button></div>
    <div class="dc" id="det-c"></div>
  </dialog>
    <dialog id="lanc" style="width:min(460px,94vw)">
    <div class="dh"><h3 id="lanc-t">Novo lançamento</h3><button id="lanc-x">Fechar</button></div>
    <div class="dc" style="padding:18px;display:grid;gap:12px">
      <label style="display:grid;gap:4px;color:var(--mut);font-size:12.5px">Data<input type="date" id="rd"></label>
      <label style="display:grid;gap:4px;color:var(--mut);font-size:12.5px">Conta bancária<select id="rcb"></select></label>
      <label style="display:grid;gap:4px;color:var(--mut);font-size:12.5px">Categoria
  <input id="rc" list="rc-list" placeholder="Digite para pesquisar..." autocomplete="off">
  <datalist id="rc-list"></datalist>
</label>
      <label style="display:grid;gap:4px;color:var(--mut);font-size:12.5px">Descrição<input id="rt" placeholder="Descrição"></label>
      <label style="display:grid;gap:4px;color:var(--mut);font-size:12.5px">Valor<input id="rv" type="number" step="0.01" placeholder="0,00"></label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="l" style="color:var(--mut)" onclick="$('#lanc').close()">Cancelar</button>
        <button class="p" id="rbtn" onclick="addReal()">Lançar</button>
      </div>
    </div>
  </dialog>
    <dialog id="cbd" style="width:min(520px,94vw)">
    <div class="dh"><h3>Contas bancárias</h3><button id="cbd-x">Fechar</button></div>
    <div class="dc" style="padding:18px">
      <div class="row">
        <input id="cbn" placeholder="Nome da conta">
        <input id="cbs" type="number" step="0.01" placeholder="Saldo inicial">
        <button class="p" id="cbbtn" onclick="salvarConta()">Adicionar</button>
      </div>
      <div id="cbl"></div>
    </div>
  </dialog>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js?v=1"></script></body>
</html>
